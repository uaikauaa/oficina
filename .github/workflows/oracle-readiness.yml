name: Oracle Readiness - TLS e Backup

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-config:
    name: Oracle Nginx TLS e scripts - validacao isolada
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sem credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validar sintaxe de scripts
        run: |
          bash -n scripts/preflight-oracle.sh
          bash -n scripts/backup-neon-offsite.sh
          ! grep -REn 'set_real_ip_from (0[.]0[.]0[.]0/0|::/0)' nginx/
          grep -F '443:8443' docker-compose.yml
          ! grep -F '80:8080' docker-compose.yml
      - name: Conferir interpolacao Compose com credenciais sinteticas
        env:
          DB_URL: jdbc:postgresql://example.invalid/neondb?sslmode=require
          DB_USERNAME: synthetic
          DB_PASSWORD: synthetic-ci-only
          JWT_SECRET: synthetic-ci-secret-strong-enough-not-for-production-2026
          CORS_ALLOWED_ORIGINS: https://app.example.invalid
          MAIL_HOST: smtp.example.invalid
          MAIL_USERNAME: synthetic
          MAIL_PASSWORD: synthetic
          MAIL_FROM: synthetic@example.invalid
        run: docker compose config --quiet
      - name: Criar certificados TLS sinteticos de teste
        run: |
          mkdir -p "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=ci.example.invalid' \
            -keyout "$RUNNER_TEMP/tls/origin.key" \
            -out "$RUNNER_TEMP/tls/origin.pem" >/dev/null 2>&1
          sudo chgrp 101 "$RUNNER_TEMP/tls/origin.key"
          chmod 640 "$RUNNER_TEMP/tls/origin.key"
          chmod 644 "$RUNNER_TEMP/tls/origin.pem"
      - name: Compilar Nginx e validar sua configuracao real com TLS
        run: |
          set -euo pipefail
          docker build -t oficina-nginx-check ./nginx
          docker network create ci_nginx
          docker run --rm -d --network ci_nginx --network-alias backend --name ci_backend busybox:1.37 sleep 300
          docker run --rm -d --network ci_nginx --network-alias frontend --name ci_frontend busybox:1.37 sleep 300
          docker run --rm --network ci_nginx \
            -v "$RUNNER_TEMP/tls:/etc/nginx/tls:ro" \
            oficina-nginx-check nginx -t
          docker run --rm -d --name ci_nginx_tls --network ci_nginx \
            -p 127.0.0.1:18443:8443 \
            -v "$RUNNER_TEMP/tls:/etc/nginx/tls:ro" \
            oficina-nginx-check
          # Confirma handshake TLS real; upstream sintetico nao precisa responder.
          timeout 20 bash -c 'until echo | openssl s_client -connect 127.0.0.1:18443 -servername ci.example.invalid -tls1_2 2>/dev/null | grep -q "BEGIN CERTIFICATE"; do sleep 1; done'
      - name: Limpar containers sinteticos
        if: always()
        run: |
          docker rm -f ci_nginx_tls ci_backend ci_frontend 2>/dev/null || true
          docker network rm ci_nginx 2>/dev/null || true
