name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Testes & Validação
    runs-on: ubuntu-24.04
    env:
      TEST_FLYWAY_LOCATION: filesystem:${{ github.workspace }}/backend/src/test/resources/db/synthetic-migration

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_gestao_test
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficinapassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Conferir migrations sintéticas antes de iniciar Spring
        shell: bash
        run: |
          set -euo pipefail
          migration_dir="$GITHUB_WORKSPACE/backend/src/test/resources/db/synthetic-migration"
          manifest="$GITHUB_WORKSPACE/backend/src/test/resources/synthetic-migrations.sha256"
          test "$TEST_FLYWAY_LOCATION" = "filesystem:$migration_dir"
          test -d "$migration_dir" && test ! -L "$migration_dir"
          mapfile -t entries < "$manifest"
          test "${#entries[@]}" -eq 22
          names=()
          for index in "${!entries[@]}"; do
            version=$((index + 1))
            pattern="^[A-F0-9]{64}  (V${version}__[a-z0-9_]+[.]sql)$"
            [[ "${entries[$index]}" =~ $pattern ]]
            name="${BASH_REMATCH[1]}"
            test -f "$migration_dir/$name" && test ! -L "$migration_dir/$name"
            names+=("$name")
          done
          diff -u <(printf '%s\n' "${names[@]}" | sort) \
            <(find "$migration_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          cd "$migration_dir"
          sha256sum --strict --check "$manifest"

      - name: Executar Testes Automatizados do Backend
        env:
          SPRING_PROFILES_ACTIVE: test
          TEST_DB_URL: jdbc:postgresql://localhost:5432/oficina_gestao_test
          TEST_DB_EXPECTED_PORT: "5432"
          TEST_DB_USERNAME: oficina
          TEST_DB_PASSWORD: oficinapassword
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw -B -ntp clean verify -Djunit.jupiter.execution.parallel.enabled=false

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js 22.x (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Registrar Versão do Ambiente Node.js
        run: |
          node --version
          npm --version

      - name: Instalar Dependências
        run: |
          cd frontend
          npm ci

      - name: Executar Testes Automatizados (Unitários)
        run: |
          cd frontend
          npm test

      - name: Executar Linter (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Executar Build de Produção (Next.js)
        env:
          INTERNAL_BACKEND_URL: http://localhost:8080
        run: |
          cd frontend
          npm run build

