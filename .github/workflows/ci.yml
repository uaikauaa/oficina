name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend — Testes & Validação
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_gestao_test
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficinapassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar Testes Automatizados do Backend
        env:
          SPRING_PROFILES_ACTIVE: test
          TEST_DB_URL: jdbc:postgresql://localhost:5432/oficina_gestao_test
          TEST_DB_USERNAME: oficina
          TEST_DB_PASSWORD: oficinapassword
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Registrar Versão do Ambiente Node.js
        run: |
          node --version
          npm --version

      - name: Instalar Dependências
        run: |
          cd frontend
          npm ci

      - name: Executar Testes Automatizados (Unitários)
        run: |
          cd frontend
          npm test

      - name: Executar Linter (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Executar Build de Produção (Next.js)
        env:
          INTERNAL_BACKEND_URL: http://localhost:8080
        run: |
          cd frontend
          npm run build

