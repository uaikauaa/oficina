name: Validacao Complementar - Flyway Real e E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-audit:
    name: Imagens backend/frontend, Trivy, SBOM e segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Instalar Trivy 0.74.0 com checksum verificado
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://github.com/aquasecurity/trivy/releases/download/v0.74.0
          curl --fail --location --silent --show-error --retry 3 -O "$base/trivy_0.74.0_checksums.txt"
          curl --fail --location --silent --show-error --retry 3 -O "$base/trivy_0.74.0_Linux-64bit.tar.gz"
          grep ' trivy_0.74.0_Linux-64bit.tar.gz$' trivy_0.74.0_checksums.txt | sha256sum --check
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Construir duas vezes sem cache e comparar digests OCI
        env:
          OFICINA_ACTIONS_KEY_FILE: ${{ runner.temp }}/next-actions-build-key
          OFICINA_BUILD_OUTPUT: ${{ runner.temp }}/release-images
        run: |
          set -euo pipefail
          node -e 'require("fs").writeFileSync(process.env.OFICINA_ACTIONS_KEY_FILE, require("crypto").randomBytes(32).toString("base64"), {mode: 0o600})'
          node scripts/build-release-images.mjs --verify-reproducible
      - name: Gerar SBOM das duas imagens
        run: |
          set -euo pipefail
          # Trivy accepts an OCI layout directory, not an OCI tar archive.
          # Extract the exact compared archives; this does not convert/rebuild layers.
          for service in backend frontend; do
            mkdir "$RUNNER_TEMP/oci-$service"
            tar -xf "$RUNNER_TEMP/release-images/$service-1.oci.tar" -C "$RUNNER_TEMP/oci-$service"
            trivy image --input "$RUNNER_TEMP/oci-$service" --offline-scan --format cyclonedx --output "$RUNNER_TEMP/sbom-$service.json"
          done
      - name: Verificar vulnerabilidades nos SBOMs e segredos nas imagens
        run: |
          set -euo pipefail
          # SBOM scan avoids Maven Central POM enrichment, which returned HTTP 429 on shared runners.
          trivy sbom --offline-scan --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "$RUNNER_TEMP/trivy-backend.json" "$RUNNER_TEMP/sbom-backend.json"
          trivy sbom --offline-scan --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "$RUNNER_TEMP/trivy-frontend.json" "$RUNNER_TEMP/sbom-frontend.json"
          trivy image --input "$RUNNER_TEMP/oci-backend" --offline-scan --scanners secret --exit-code 1 --format json --output "$RUNNER_TEMP/trivy-backend-secrets.json"
          trivy image --input "$RUNNER_TEMP/oci-frontend" --offline-scan --scanners secret --exit-code 1 --format json --output "$RUNNER_TEMP/trivy-frontend-secrets.json"
          trivy fs --offline-scan --scanners secret --skip-dirs .git --skip-dirs frontend/node_modules --skip-dirs frontend/.next --skip-dirs backend/target --exit-code 1 --format json --output "$RUNNER_TEMP/trivy-files.json" .
      - name: Preservar relatórios do SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/trivy-backend.json
            ${{ runner.temp }}/trivy-frontend.json
            ${{ runner.temp }}/trivy-backend-secrets.json
            ${{ runner.temp }}/trivy-frontend-secrets.json
            ${{ runner.temp }}/trivy-files.json
            ${{ runner.temp }}/sbom-backend.json
            ${{ runner.temp }}/sbom-frontend.json
            ${{ runner.temp }}/release-images/release-manifest.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remover chave efemera de build
        if: always()
        run: rm -f "$RUNNER_TEMP/next-actions-build-key"
  flyway-real:
    name: Flyway real em PostgreSQL descartavel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_migrations_ci
          POSTGRES_USER: ci_isolado
          POSTGRES_PASSWORD: senha-sintetica-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_isolado -d oficina_migrations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Aplicar as migrations REAIS do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -d backend/src/main/resources/db/migration
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.14.1@sha256:ba032dc3fc4510694e1d096e2491ef562e42170ed91eec66ee5377b1124913d8 \
            -url=jdbc:postgresql://127.0.0.1:5432/oficina_migrations_ci \
            -user=ci_isolado -password=senha-sintetica-ci \
            -connectRetries=15 -locations=filesystem:/flyway/sql migrate
      - name: Validar historico Flyway no banco descartavel
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-flyway-baseline.mjs
          actual=$(docker run --rm --network host -e PGPASSWORD=senha-sintetica-ci postgres:16-alpine \
            psql -h 127.0.0.1 -U ci_isolado -d oficina_migrations_ci -Atc \
            "SELECT count(*) FROM flyway_schema_history WHERE success AND version='24' AND type='SQL_BASELINE' AND script='B24__neutral_initial_schema.sql';")
          test "$actual" -eq 1
          clean=$(docker run --rm --network host -e PGPASSWORD=senha-sintetica-ci postgres:16-alpine \
            psql -h 127.0.0.1 -U ci_isolado -d oficina_migrations_ci -Atc \
            "SELECT (SELECT count(*)=0 FROM usuarios) AND (SELECT count(*)=1 FROM configuracao_oficina WHERE nome_fantasia='Oficina não configurada' AND cnpj IS NULL AND email IS NULL AND responsavel IS NULL);")
          test "$clean" = t
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.14.1@sha256:ba032dc3fc4510694e1d096e2491ef562e42170ed91eec66ee5377b1124913d8 \
            -url=jdbc:postgresql://127.0.0.1:5432/oficina_migrations_ci \
            -user=ci_isolado -password=senha-sintetica-ci \
            -locations=filesystem:/flyway/sql validate

  playwright:
    name: Playwright - fluxos com API mockada
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Validar tipos TypeScript dos testes E2E
        run: npx tsc -p e2e/tsconfig.json --noEmit
      - name: Instalar Chromium e dependencias
        run: npx playwright install --with-deps chromium
      - name: Build Next.js isolado
        env:
          INTERNAL_BACKEND_URL: http://127.0.0.1:8080
        run: npm run build
      - name: TLS e SMTP locais com certificados efemeros
        run: node --test ../scripts/homologation/tls-isolated.test.mjs
      - name: Proxy standalone - cookies CSRF JWT erros PDF CSV e limites
        run: node ../scripts/test-proxy-runtime.mjs
      - name: E2E mockados sem servidor backend produtivo
        env:
          CI: 'true'
        run: npx playwright test --project=chromium
      - name: Guardar evidencias em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidencias
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
