name: Integracao Real - Frontend Backend PostgreSQL 2FA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-stack:
    name: Stack real - Login 2FA Estoque OS e limitador distribuido
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      INTERNAL_BACKEND_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Configurar Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Configurar Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar backend real
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean package -DskipTests
      - name: Instalar frontend e Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build Next.js
        working-directory: frontend
        run: npm run build
      - name: Stack sintetica completa e duas JVMs com reinicializacao
        run: node scripts/test-real-stack-local.mjs
      - name: Salvar diagnosticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-integration-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
            audit-hardening-real-backend.log
          if-no-files-found: ignore
