name: Integracao Real - Frontend Backend PostgreSQL 2FA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-stack:
    name: Stack real - Login 2FA Estoque e OS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_integracao_ci
          POSTGRES_USER: ci_isolado
          POSTGRES_PASSWORD: ci-integration-db-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_isolado -d oficina_integracao_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      RUN_REAL_INTEGRATION: "true"
      CI_INTEGRATION_ADMIN_EMAIL: ci.integration@oficina.invalid
      CI_INTEGRATION_ADMIN_PASSWORD: "CiIntegration#2026Secure!"
      INTERNAL_BACKEND_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Iniciar SMTP de testes Mailpit
        run: |
          docker run -d --name ci-mailpit -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 axllent/mailpit:latest
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8025/api/v1/messages >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs ci-mailpit
          exit 1
      - name: Compilar backend real
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean package -DskipTests
      - name: Iniciar API com Flyway real e PostgreSQL descartavel
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:postgresql://127.0.0.1:5432/oficina_integracao_ci
          DB_USERNAME: ci_isolado
          DB_PASSWORD: ci-integration-db-only
          JWT_SECRET: ci-integration-only-jwt-2026-synthetic-value-never-for-production
          SECURITY_COOKIE_SECURE: "false"
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          MAIL_HOST: 127.0.0.1
          MAIL_PORT: "1025"
          MAIL_USERNAME: ci.integration@oficina.invalid
          MAIL_PASSWORD: ci-smtp-only
          MAIL_FROM: ci.integration@oficina.invalid
          MAIL_SMTP_AUTH: "false"
          MAIL_SMTP_STARTTLS: "false"
          INITIAL_ADMIN_NAME: Admin Sintetico CI
          INITIAL_ADMIN_EMAIL: ci.integration@oficina.invalid
          INITIAL_ADMIN_PASSWORD: "CiIntegration#2026Secure!"
        run: |
          java -jar backend/target/backend-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/backend-integration.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend-integration.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/backend-integration.pid")" 2>/dev/null; then break; fi
            sleep 2
          done
          tail -n 150 "$RUNNER_TEMP/backend-integration.log"
          exit 1
      - name: Instalar frontend e Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build do Next.js apontando ao backend descartavel
        working-directory: frontend
        run: npm run build
      - name: Testar stack real sem mocks
        working-directory: frontend
        run: npx playwright test e2e/integration-real.spec.ts --project=chromium --workers=1
      - name: Salvar diagnosticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-integration-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
      - name: Exibir backend ao falhar
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/backend-integration.log"; then
            tail -n 120 "$RUNNER_TEMP/backend-integration.log"
          fi
