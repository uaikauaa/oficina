worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $request_uri $status $body_bytes_sent';
    access_log /dev/stdout main;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Seguro por padrao: sem set_real_ip_from, CF-Connecting-IP e ignorado.
    # No deploy real, o include recebe somente as faixas oficiais atuais da Cloudflare.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    include /etc/nginx/cloudflare-realip.conf;

    include /etc/nginx/conf.d/*.conf;
}
