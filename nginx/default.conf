upstream backend_upstream {
    server backend:8080;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

# HTTP exclusivamente dentro da rede Docker para healthchecks;
# a porta 8080 NAO e publicada no host.
server {
    listen 8080 default_server;
    server_name _;
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
    location / { return 404; }
}

# Trafego externo: apenas HTTPS 443 -> 8443 (UID nginx, porta nao privilegiada).
# Cloudflare deve usar Full (strict), com Origin CA correspondente ao hostname.
server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # O Host e os forwarded headers recebidos do cliente nunca sao aceitos
    # diretamente: o Nginx recria os headers usando os dados verificados.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://frontend_upstream;
    }
}
