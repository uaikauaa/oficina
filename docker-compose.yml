name: oficina-gestao

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_ENVIRONMENT: production
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SECURITY_COOKIE_SECURE: "true"
      SECURITY_JWT_REFRESH_EXPIRATION_TEMP_MS: ${SECURITY_JWT_REFRESH_EXPIRATION_TEMP_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      TRUSTED_PROXIES: 172.28.0.10
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      MAIL_CONNECTION_TIMEOUT: ${MAIL_CONNECTION_TIMEOUT:-15000}
      MAIL_READ_TIMEOUT: ${MAIL_READ_TIMEOUT:-25000}
      MAIL_WRITE_TIMEOUT: ${MAIL_WRITE_TIMEOUT:-25000}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-10}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-2}
      HIKARI_MAX_LIFETIME: ${HIKARI_MAX_LIFETIME:-600000}
      HIKARI_IDLE_TIMEOUT: ${HIKARI_IDLE_TIMEOUT:-300000}
      HIKARI_CONN_TIMEOUT: ${HIKARI_CONN_TIMEOUT:-20000}
      HIKARI_KEEPALIVE_TIME: ${HIKARI_KEEPALIVE_TIME:-120000}
      SWAGGER_ENABLED: "false"
      API_DOCS_ENABLED: "false"
    expose:
      - "8080"
    networks:
      - oficina_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      INTERNAL_BACKEND_URL: http://backend:8080
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oficina_net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      oficina_net:
        ipv4_address: 172.28.0.10

networks:
  oficina_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
