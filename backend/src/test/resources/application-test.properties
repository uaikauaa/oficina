# Dedicated PostgreSQL datasource for automated tests. There is intentionally no
# fallback to DB_URL/DB_USERNAME/DB_PASSWORD.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Positive identification consumed by the test-only fail-fast guard.
app.test-database=true

# Keep integration behavior aligned with the real PostgreSQL/Flyway stack.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Synthetic values only. Automated tests never need operational credentials.
security.jwt.secret=oficina-gestao-test-only-jwt-secret-2026-with-safe-length
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@oficinagestao.local
spring.mail.password=test-only
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
INITIAL_ADMIN_NAME=Administrador de Teste
INITIAL_ADMIN_EMAIL=
INITIAL_ADMIN_PASSWORD=
