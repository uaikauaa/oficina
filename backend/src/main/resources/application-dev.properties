# ==============================================================================
# Oficina Gestão — Configurações para Ambiente de Desenvolvimento (Profile: dev)
# ==============================================================================
# ATENÇÃO: Este arquivo é ativado EXCLUSIVAMENTE quando o profile 'dev' estiver ativo
# (ex: SPRING_PROFILES_ACTIVE=dev).
#
# Em desenvolvimento local, permite fallback para a chave padrão de desenvolvimento
# caso a variável de ambiente JWT_SECRET não seja fornecida no .env.
# Em qualquer outro profile (ou ausência de profile), a variável JWT_SECRET é estritamente obrigatória.
# ==============================================================================

security.jwt.secret=${JWT_SECRET:default-secret-key-oficina-gestao-dev-environment-2026-secure-token}

# ------------------------------------------------------------------------------
# Swagger / OpenAPI em Desenvolvimento (ADC-02)
# ------------------------------------------------------------------------------
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
