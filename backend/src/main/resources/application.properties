# ==============================================================================
# Oficina Gestão — Configurações da Aplicação Backend
# ==============================================================================

spring.application.name=oficina-gestao-backend
server.port=${SERVER_PORT:8080}
# SEC-03: forwarded headers are interpreted exclusively by IpAddressResolver,
# after the socket peer is checked against security.trusted-proxies.
server.forward-headers-strategy=none

# ------------------------------------------------------------------------------
# Configuração do PostgreSQL / Neon Datasource
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------------------
# O Hibernate NUNCA deve alterar ou criar schema. Apenas validação.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ------------------------------------------------------------------------------
# Flyway Migration Management
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ------------------------------------------------------------------------------
# Configurações de Segurança e JWT
# ------------------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=900000
security.jwt.refresh-expiration-ms=604800000
security.jwt.refresh-expiration-temp-ms=${SECURITY_JWT_REFRESH_EXPIRATION_TEMP_MS:86400000}
security.cookie.secure=${SECURITY_COOKIE_SECURE:false}
# SEC-03: Lista de IPs de proxies reversos confiáveis (separados por vírgula).
# Headers CF-Connecting-IP, X-Real-IP e X-Forwarded-For SOMENTE são considerados
# quando a conexão TCP imediata (remoteAddr) pertencer a esta lista.
# Em desenvolvimento local, manter vazio (sem proxy) é o comportamento seguro padrão.
security.trusted-proxies=${TRUSTED_PROXIES:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ------------------------------------------------------------------------------
# Pool de Conexões HikariCP Calibrado (PROD001-07)
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:600000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:20000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:120000}

# ------------------------------------------------------------------------------
# Swagger / OpenAPI (PROD001-09 / ADC-02)
# ------------------------------------------------------------------------------
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}

# ------------------------------------------------------------------------------
# Configurações do Spring Boot Actuator (ADC-04)
# ------------------------------------------------------------------------------
# Exposição HTTP estritamente restrita ao endpoint de health check.
# Endpoints sensíveis (env, beans, mappings, metrics, loggers, heapdump, etc.)
# NÃO são expostos via HTTP.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# ------------------------------------------------------------------------------
# Configurações de E-mail / SMTP (2FA)
# ------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:15000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:25000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:25000}
app.mail.from=${MAIL_FROM:noreply@oficinagestao.com.br}
