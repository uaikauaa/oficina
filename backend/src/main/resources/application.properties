# ==============================================================================
# Oficina Gestão — Configurações da Aplicação Backend
# ==============================================================================

spring.application.name=oficina-gestao-backend
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# Configuração do PostgreSQL / Neon Datasource
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------------------
# O Hibernate NUNCA deve alterar ou criar schema. Apenas validação.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ------------------------------------------------------------------------------
# Flyway Migration Management
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ------------------------------------------------------------------------------
# Configurações de Segurança e JWT
# ------------------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:default-secret-key-oficina-gestao-dev-environment-2026-secure-token}
security.jwt.expiration-ms=900000
security.cookie.secure=false
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}


