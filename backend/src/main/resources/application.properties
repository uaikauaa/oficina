# ==============================================================================
# Oficina Gestão — Configurações da Aplicação Backend
# ==============================================================================

spring.application.name=oficina-gestao-backend
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# ------------------------------------------------------------------------------
# Configuração do PostgreSQL / Neon Datasource
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------------------
# O Hibernate NUNCA deve alterar ou criar schema. Apenas validação.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ------------------------------------------------------------------------------
# Flyway Migration Management
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ------------------------------------------------------------------------------
# Configurações de Segurança e JWT
# ------------------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:default-secret-key-oficina-gestao-dev-environment-2026-secure-token}
security.jwt.expiration-ms=900000
security.jwt.refresh-expiration-ms=604800000
security.cookie.secure=${SECURITY_COOKIE_SECURE:false}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ------------------------------------------------------------------------------
# Pool de Conexões HikariCP Calibrado (PROD001-07)
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:600000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:20000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:120000}

# ------------------------------------------------------------------------------
# Swagger / OpenAPI (PROD001-09)
# ------------------------------------------------------------------------------
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
