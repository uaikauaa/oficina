# ==============================================================================
# Oficina Gestão — Configurações para Ambiente de Produção (Profile: prod)
# ==============================================================================

# ------------------------------------------------------------------------------
# Segurança e JWT (PROD001-01 & PROD001-02)
# ------------------------------------------------------------------------------
# Em produção, a chave JWT DEVE ser fornecida exclusivamente via variável de ambiente.
# Nenhum valor default inseguro é admitido.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=900000
security.jwt.refresh-expiration-ms=604800000
security.jwt.refresh-expiration-temp-ms=${SECURITY_JWT_REFRESH_EXPIRATION_TEMP_MS:86400000}

# Cookies HttpOnly trafegam com a flag Secure=true por padrão em produção (HTTPS obrigatório)
security.cookie.secure=${SECURITY_COOKIE_SECURE:true}
# SEC-03: IPs dos proxies reversos confiáveis em produção (obrigatório quando usar Cloudflare/Nginx).
# Exemplo para Cloudflare em Render/Railway: informe os IPs do pod de saída do proxy.
# Em produção sem proxy reverso configurado, manter vazio para máxima segurança.
security.trusted-proxies=${TRUSTED_PROXIES:}

# ------------------------------------------------------------------------------
# CORS — Controle de Origem Estrito (PROD001-03)
# ------------------------------------------------------------------------------
# Em produção, a origem deve ser a URL HTTPS pública do frontend (sem fallback para localhost).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ------------------------------------------------------------------------------
# Pool de Conexões HikariCP — Calibrado para Neon Serverless (PROD001-07)
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:600000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:20000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:120000}

# ------------------------------------------------------------------------------
# Swagger / OpenAPI em Produção (PROD001-09)
# ------------------------------------------------------------------------------
# Em produção, a documentação interativa fica desabilitada por padrão para prevenir enumeração de rotas.
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}

# ------------------------------------------------------------------------------
# Configurações Adicionais de Produção
# ------------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
# SEC-03: preserve request.getRemoteAddr() as the socket peer. Nginx must
# recreate forwarded headers and its address must be listed in TRUSTED_PROXIES.
server.forward-headers-strategy=none

# ------------------------------------------------------------------------------
# Configurações do Spring Boot Actuator em Produção (ADC-04)
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# ------------------------------------------------------------------------------
# Configurações de E-mail / SMTP em Produção (2FA)
# ------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@oficinagestao.com.br}
